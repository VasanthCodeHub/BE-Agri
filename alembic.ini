# Alembic configuration.
#
# NOTE: `sqlalchemy.url` is deliberately NOT set here.
# This file is committed, so a database URL with a password would be a leaked
# credential. Instead, app/db/migrations/env.py reads the URL from Settings,
# which reads it from the environment — exactly like the application does.

[alembic]
script_location = app/db/migrations

# Lets the alembic CLI import our `app` package.
prepend_sys_path = .

# Timestamp-prefixed filenames, so listing the folder shows migrations in the
# order they were written: 20260813_0912_add_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Store migration timestamps in UTC.
timezone = UTC


# ---------------------------------------------------------------------------
# Logging (used only by the alembic CLI, not by the app)
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
